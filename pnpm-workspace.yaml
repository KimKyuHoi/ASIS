# pnpm 설정 파일.
# pnpm 11 부터 node_modules 구조·빌드 허용 목록 등 대부분의 설정은 .npmrc 와
# package.json 의 "pnpm" 필드에서 더 이상 읽히지 않고 이 파일에서만 읽는다.
# (.npmrc 는 auth / registry / TLS / proxy 용도로만 남는다)
#
# packages 필드를 두지 않으므로 워크스페이스에는 루트 패키지만 포함된다.
# landing/ 은 자체 pnpm-lock.yaml 로 따로 설치하는 별도 패키지다.

# Electron 의 native modules (electron, electron-builder, electron-vite 등) 가
# 평탄한 node_modules 를 가정하고 동작하므로 pnpm 기본 isolated 구조 대신
# 호환성 우선의 hoisted 구조를 사용한다.
#
# 트레이드오프
#   + Electron / electron-builder 동작 안정 (npm 과 거의 동등)
#   + ESLint / Prettier / Konva 등이 평탄 트리 가정해도 OK
#   - pnpm 의 phantom dependency 차단 효과는 약화
nodeLinker: hoisted

# 신규 의존성을 추가할 때 lockfile 갱신 강제
strictPeerDependencies: false

# 설치 시 빌드 스크립트 실행을 허용할 패키지 (pnpm 11 의 allowBuilds).
# 목록에 없는 패키지가 빌드 스크립트를 가지면 ERR_PNPM_IGNORED_BUILDS 로 실패한다.
allowBuilds:
  electron: true
  esbuild: true
  ffmpeg-static: true
  # koffi 는 npm 패키지에 prebuilt 바이너리가 포함돼 있고,
  # pnpm 10 시절 onlyBuiltDependencies 에도 없어 install 스크립트가 실행된 적이 없다.
  # 기존 동작을 그대로 유지한다.
  koffi: false
  # electron-winstaller 는 Windows 설치 파일 생성용 도구로 macOS 빌드에서 쓰이지 않고,
  # pnpm 10 시절에도 install 스크립트가 실행된 적이 없다.
  electron-winstaller: false
